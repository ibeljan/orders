<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orders — DevOps Workshop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Orders</h1>
    <p class="subtitle">Place an order and watch worker process it</p>
  </header>

  <main>
    <section class="card">
      <h2>New order</h2>
      <form id="order-form">
        <label>Product <input id="product" name="product" required maxlength="100" placeholder="Laptop"></label>
        <label>Quantity <input id="quantity" name="quantity" type="number" min="1" max="1000" value="1" required></label>
        <button type="submit">Place order</button>
      </form>
      <p id="form-message" class="message" role="status"></p>
    </section>

    <section class="card">
      <h2>Orders <span id="counts" class="counts"></span></h2>
      <p id="api-error" class="error" hidden>Orders API is unavailable.</p>
      <table>
        <thead>
          <tr><th>#</th><th>Product</th><th>Qty</th><th>Status</th><th>Processed by</th><th></th></tr>
        </thead>
        <tbody id="orders"></tbody>
      </table>
      <p id="empty" class="muted" hidden>No orders yet.</p>
    </section>
  </main>

  <footer id="info">
    <span>web: <b id="web-version">?</b> on <code id="web-host">?</code></span>
    <span>api: <b id="api-version">?</b> on <code id="api-host">?</code></span>
  </footer>

  <script src="app.js"></script>
</body>
</html>

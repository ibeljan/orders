apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-worker
  namespace: dev
  labels: { app: orders-worker, tier: backend }
spec:
  replicas: 1
  selector:
    matchLabels: { app: orders-worker }
  template:
    metadata:
      labels: { app: orders-worker, tier: backend }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: worker
          image: acrdevopswsivanbeljan.azurecr.io/orders-worker:1.0.0
          env:
            - { name: APP_VERSION, value: "1.0.0" }
          envFrom:
            - configMapRef: { name: orders-config }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
          livenessProbe:                                 # no HTTP endpoint: check the heartbeat file
            exec:
              command: ["python", "-c", "import os,sys,time; sys.exit(0 if time.time()-os.path.getmtime('/tmp/worker-heartbeat') < 60 else 1)"]
            initialDelaySeconds: 20
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false

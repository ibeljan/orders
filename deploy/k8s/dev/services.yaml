apiVersion: v1
kind: Service
metadata:
  name: orders-api
  namespace: dev
  labels: { app: orders-api }
spec:
  type: ClusterIP
  selector: { app: orders-api }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata:
  name: orders-web
  namespace: dev
  labels: { app: orders-web }
spec:
  type: LoadBalancer                                     # Azure gives it a public IP
  selector: { app: orders-web }
  ports: [{ name: http, port: 80, targetPort: http }]

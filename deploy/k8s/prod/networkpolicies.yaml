# Default deny ingress for the namespace, then allow only the flows the app needs:
#   internet → web → api → postgres,  worker → api
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-ingress, namespace: prod }
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-web-from-anywhere, namespace: prod }
spec:
  podSelector: { matchLabels: { app: orders-web } }
  policyTypes: [Ingress]
  ingress: [{ ports: [{ port: 3000 }] }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-api-from-web-and-worker, namespace: prod }
spec:
  podSelector: { matchLabels: { app: orders-api } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: orders-web } }
        - podSelector: { matchLabels: { app: orders-worker } }
        - podSelector: { matchLabels: { access: orders-api } }   # helper Pods: load generator, test clients
      ports: [{ port: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-postgres-from-api, namespace: prod }
spec:
  podSelector: { matchLabels: { app: postgres } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: orders-api } } }]
      ports: [{ port: 5432 }]
